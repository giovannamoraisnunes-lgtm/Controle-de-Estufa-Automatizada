<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estufa Automatizada - IoT</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #eef2f3; margin-top: 50px; }
        .card { background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        .sensor-valor { font-size: 28px; font-weight: bold; color: #27ae60; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Painel da Estufa</h1>
        <p>Monitoramento em tempo real via ESP32</p>
        
        <div>
            <p>Temperatura:</p>
            <div id="temperatura" class="sensor-valor">Carregando...</div>
        </div>
        
        <div>
            <p>Umidade:</p>
            <div id="umidade" class="sensor-valor">Carregando...</div>
        </div>
    </div>

    <!-- Script de Integração com o Firebase -->
    <script type="module">
        // Importa o Firebase v9 (compatível com navegadores via CDN)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // Configuração do seu projeto Firebase (substitua pela sua URL)
        const firebaseConfig = {
            databaseURL: "https://seu-projeto-default-rtdb.firebaseio.com"
        };

        // Inicializa o Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Ouve as mudanças no caminho /estufa do banco de dados
        const estufaRef = ref(db, 'estufa');
        onValue(estufaRef, (snapshot) => {
            const dados = snapshot.val();
            if (dados) {
                // Atualiza os elementos HTML com os valores recebidos do ESP32
                document.getElementById('temperatura').innerText = dados.temperatura ? dados.temperatura.toFixed(1) + " °C" : "--";
                document.getElementById('umidade').innerText = dados.umidade ? dados.umidade.toFixed(1) + " %" : "--";
            }
        });
    </script>

</body>
</html>
